<svg xmlns="http://www.w3.org/2000/svg" width="420" height="532" viewBox="0 0 420 532" role="img" aria-labelledby="title desc">
  <title id="title">HomeOffice Commerce source-defined architecture</title>
  <desc id="desc">Next.js to Flask to PostgreSQL. Helm application packaging and separate Google Cloud Terraform definitions. Not a verified live deployment.</desc>
  <rect x="1" y="1" width="418" height="530" rx="12" fill="#101d31" stroke="#37506c"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="24" y="36" fill="#9dbad2" font-size="17" letter-spacing="1">APPLICATION / HELM</text>
    <g fill="#19314c" stroke="#476787">
      <rect x="24" y="56" width="372" height="79" rx="9"/>
      <rect x="24" y="165" width="372" height="79" rx="9"/>
      <rect x="24" y="274" width="372" height="79" rx="9"/>
    </g>
    <g fill="#f2f7fc" font-size="25" font-weight="600">
      <text x="45" y="88">Next.js</text><text x="45" y="197">Flask</text><text x="45" y="306">PostgreSQL</text>
    </g>
    <g fill="#c1d1e2" font-size="19">
      <text x="45" y="115">Frontend</text><text x="45" y="224">API / Gunicorn</text><text x="45" y="333">Database</text>
    </g>
    <path d="M210 137v21m-6-8 6 8 6-8M210 246v21m-6-8 6 8 6-8" fill="none" stroke="#71c5ee" stroke-width="2"/>
    <path d="M24 380h372" stroke="#37506c"/>
    <text x="24" y="411" fill="#9dbad2" font-size="17" letter-spacing="1">TERRAFORM / GOOGLE CLOUD</text>
    <text x="24" y="450" fill="#e0ecf6" font-size="21">VPC / GKE / Artifact Registry</text>
    <text x="24" y="486" fill="#9dbad2" font-size="17">Separate source definitions.</text>
    <text x="24" y="511" fill="#9dbad2" font-size="17">Not a live deployment map.</text>
  </g>
</svg>
